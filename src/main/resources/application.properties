# =====================================================================
# Configuração central. Valores sensíveis vêm de variáveis de ambiente
# ou do arquivo .env (fora do Git). Nenhuma credencial fica no código.
# =====================================================================
spring.application.name=login-seguro
server.port=${PORT:8080}

# Lê o arquivo .env da raiz do projeto, se existir
spring.config.import=optional:file:.env[.properties]

# ---------- MongoDB Atlas ----------
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:login_seguro}
# Cria os índices declarados nas entidades (ex.: e-mail único)
spring.data.mongodb.auto-index-creation=true

# ---------- Sessões (Spring Session no MongoDB) ----------
spring.session.mongodb.collection-name=sessoes
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ---------- Aplicação ----------
app.tema.nome=${APP_TEMA:padrao}
app.tema.nome-sistema=${APP_NOME:Login Seguro}
app.tema.disponiveis=padrao,escuro,vibrante
app.admin.nome=Administrador
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}
