<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head><title>Criar conta</title></head>
<body>
<div layout:fragment="conteudo" class="caixa-formulario">
    <h1>Criar conta</h1>

    <!-- th:object liga o formulário ao CadastroForm; th:errors mostra a validação -->
    <form th:action="@{/cadastro}" th:object="${form}" method="post" class="formulario" novalidate>
        <div class="campo" th:classappend="${#fields.hasErrors('nome')} ? 'campo-invalido'">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" autocomplete="name" required>
            <p class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('email')} ? 'campo-invalido'">
            <label for="email">E-mail</label>
            <input type="email" id="email" th:field="*{email}" autocomplete="email" required>
            <p class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('senha')} ? 'campo-invalido'">
            <label for="senha">Senha</label>
            <!-- th:value vazio: a senha nunca é devolvida para a tela -->
            <input type="password" id="senha" name="senha" th:value="''" autocomplete="new-password" required>
            <p class="dica">Mínimo de 8 caracteres, com maiúscula, minúscula e número.</p>
            <p class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></p>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('confirmacaoSenha')} ? 'campo-invalido'">
            <label for="confirmacaoSenha">Repita a senha</label>
            <input type="password" id="confirmacaoSenha" name="confirmacaoSenha" th:value="''"
                   autocomplete="new-password" required>
            <p class="erro-campo" th:if="${#fields.hasErrors('confirmacaoSenha')}"
               th:errors="*{confirmacaoSenha}"></p>
        </div>

        <button type="submit" class="botao botao-largo">Criar conta</button>
    </form>

    <p class="rodape-formulario">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
</div>
</body>
</html>
