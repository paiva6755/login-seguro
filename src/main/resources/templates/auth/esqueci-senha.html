<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head><title>Esqueci minha senha</title></head>
<body>
<div layout:fragment="conteudo" class="caixa-formulario">
    <h1>Esqueci minha senha</h1>
    <p>Informe o e-mail da sua conta. Enviaremos um link para você criar uma nova senha.</p>

    <form th:action="@{/esqueci-senha}" method="post" class="formulario">
        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" maxlength="120" required autocomplete="email" autofocus>
        </div>
        <button type="submit" class="botao botao-largo">Enviar link</button>
    </form>

    <p class="rodape-formulario">Lembrou a senha? <a th:href="@{/login}">Entrar</a></p>
</div>
</body>
</html>
