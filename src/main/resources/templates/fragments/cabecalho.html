<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="cabecalho" class="cabecalho">
    <a class="marca" th:href="@{/}" th:text="${nomeSistema ?: 'Login Seguro'}">Login Seguro</a>

    <nav class="menu" aria-label="Menu principal">
        <!-- Visível só para quem está logado -->
        <th:block sec:authorize="isAuthenticated()">
            <a th:href="@{/painel}">Meu painel</a>
            <a sec:authorize="hasAnyRole('PROFESSOR','ADMIN')" th:href="@{/professor}">Turma</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Usuários</a>
            <span class="usuario-atual" sec:authentication="principal.nome">Nome</span>
            <!-- Logout é POST para exigir o token CSRF -->
            <form th:action="@{/logout}" method="post" class="form-linha">
                <button type="submit" class="botao botao-discreto">Sair</button>
            </form>
        </th:block>

        <!-- Visível só para visitantes -->
        <th:block sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}">Entrar</a>
            <a th:href="@{/cadastro}" class="botao">Criar conta</a>
        </th:block>

        <!-- Seletor de tema: a lista vem de app.tema.disponiveis -->
        <form th:action="@{/tema}" method="post" class="form-linha seletor-tema"
              th:if="${temasDisponiveis != null and #lists.size(temasDisponiveis) > 1}">
            <input type="hidden" name="voltarPara" th:value="${caminhoAtual ?: '/'}">
            <label for="tema" class="so-leitor">Tema</label>
            <select id="tema" name="nome">
                <option th:each="t : ${temasDisponiveis}" th:value="${t}" th:text="${t}"
                        th:selected="${t == tema}">padrao</option>
            </select>
            <button type="submit" class="botao botao-discreto">Aplicar tema</button>
        </form>
    </nav>
</header>
</body>
</html>
