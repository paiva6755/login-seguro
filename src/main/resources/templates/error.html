<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head><title>Erro</title></head>
<body>
<!-- Página genérica de erro usada pelo Spring Boot (404, 500...) -->
<div layout:fragment="conteudo" class="caixa-formulario">
    <h1 th:text="${status == 404} ? 'Página não encontrada' : 'Algo deu errado'">Erro</h1>
    <p th:if="${status == 404}">O endereço digitado não existe. Confira o link ou volte ao início.</p>
    <p th:unless="${status == 404}">O servidor não conseguiu concluir a ação. Tente novamente em instantes.</p>
    <a th:href="@{/}" class="botao">Voltar ao início</a>
</div>
</body>
</html>
